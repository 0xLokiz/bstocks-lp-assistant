[mypy]
# check_untyped_defs (not --strict): this codebase (riskscreen.py, bstocks_lp/) has no type
# annotations, and adding them throughout is a separate, larger effort than "basic type-checking"
# -- but the default lenient
# mode skips checking the *body* of every untyped function entirely, catching nothing. This
# middle ground still type-checks function bodies via inference even without annotated
# signatures -- it already caught a real inconsistent-variable-type bug in _get() during setup.
check_untyped_defs = True
