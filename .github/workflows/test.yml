name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile riskscreen.py
      - run: pytest test_riskscreen.py test_riskscreen_integration.py -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-lint.txt
      - run: ruff check .
      - run: mypy riskscreen.py test_riskscreen.py test_riskscreen_integration.py
      - run: pip-audit -r requirements.txt -r requirements-lint.txt
